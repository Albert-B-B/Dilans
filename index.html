<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilans Menu Spinner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2ecc71;
            margin-bottom: 30px;
        }
        #wheel-container {
            background-color: #34495e;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            margin-bottom: 30px;
        }
        #result-number {
            font-size: 5rem;
            font-weight: bold;
            color: #f1c40f;
            margin: 0;
            line-height: 1;
        }
        #result-name {
            font-size: 1.8rem;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #result-desc {
            font-size: 1.2rem;
            color: #bdc3c7;
            min-height: 60px;
        }
        #result-category {
            font-size: 1rem;
            color: #9b59b6;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            min-height: 20px;
        }
        .fade-in {
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }
        .fade-in.visible {
            opacity: 1;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:hover {
            background-color: #27ae60;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .spinning #result-number {
            animation: pulse 0.1s infinite alternate;
            filter: blur(2px);
        }
        @keyframes pulse {
            from { opacity: 0.8; transform: translateY(-2px); }
            to { opacity: 1; transform: translateY(2px); }
        }
        .filters {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            background-color: #34495e;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .filters label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .filters input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
    </style>
</head>

        // Funktion til at finde kategori fra ID
        function getCategoryForID(id) {
            if (id.startsWith("Menu")) return "DILAN'S MENUER";
            if (id === "50a") return "DURUM RULLER";
            const num = parseInt(id);
            if (!num) return "";
            
            if ((num >= 1 && num <= 46) || (num >= 63 && num <= 65)) return "PIZZA";
            if (num >= 47 && num <= 50) return "DURUM RULLER";
            if ((num >= 51 && num <= 54) || num === 162 || num === 163) return "BØRNE MENU";
            if (num >= 55 && num <= 62) return "PASTA";
            if (num >= 69 && num <= 78) return "BURGERE";
            if ((num >= 79 && num <= 85) || num === 164 || num === 165) return "STORE BURGERE";
            if ((num >= 86 && num <= 92) || num === 105) return "PITABRØD";
            if (num >= 93 && num <= 101) return "PIZZA SANDWICH (PANINO)";
            if ((num >= 102 && num <= 119)) return "A LA CARTE";
            if (num >= 121 && num <= 123) return "NACHOS";
            if (num >= 124 && num <= 131) return "STORE SALATER";
            if ((num >= 132 && num <= 134) || num === 150) return "BAGT KARTOFFEL";
            if (num >= 135 && num <= 143) return "POMMES FRITES & DIVERSE";
            
            return "";
        }

        const btn = document.getElementById('spin-btn');
        const numberEl = document.getElementById('result-number');
        const nameEl = document.getElementById('result-name');
        const descEl = document.getElementById('result-desc');
        const categoryEl = document.getElementById('result-category');
        const wheelContainer = document.getElementById('wheel-container');

        // ID-lister til filtre
        const vegetarIds = ["5", "13", "63", "64", "65", "50a", "91", "98", "121", "124", "125", "132", "135", "136", "138", "139", "140"];
        const pescetarIds = [...vegetarIds, "28", "54", "110", "126", "127", "150"];

        // Håndtering af gensidig udelukkelse på checkboxes
        const vegToggle = document.getElementById('veg-toggle');
        const pesceToggle = document.getElementById('pesce-toggle');

        vegToggle.addEventListener('change', () => {
            if (vegToggle.checked) pesceToggle.checked = false;
        });

        pesceToggle.addEventListener('change', () => {
            if (pesceToggle.checked) vegToggle.checked = false;
        });

        btn.addEventListener('click', () => {
            btn.disabled = true;
            wheelContainer.classList.add('spinning');
            
            // Bestem aktiv menu baseret på filtre
            let activeMenu = menuItems;
            if (vegToggle.checked) {
                activeMenu = menuItems.filter(item => vegetarIds.includes(item.id));
            } else if (pesceToggle.checked) {
                activeMenu = menuItems.filter(item => pescetarIds.includes(item.id));
            }
            
            // Fald tilbage på alle hvis gruppen er tom af en eller anden grund
            if (activeMenu.length === 0) activeMenu = menuItems;

            // Skjul tekst, vis kun nummer under spin
            categoryEl.classList.remove('visible');
            nameEl.classList.remove('visible');
            descEl.classList.remove('visible');
            
            // Mens vi spinner, skal vi vise random numre, men teksten er skjult
            let spinCount = 0;
            const maxSpins = 30;
            const intervalTime = 50;

            const spinInterval = setInterval(() => {
                const randomItem = activeMenu[Math.floor(Math.random() * activeMenu.length)];
                numberEl.textContent = randomItem.id;
                // Opdaterer ikke tekst-elementerne imens

                spinCount++;
                if (spinCount >= maxSpins) {
                    clearInterval(spinInterval);
                    wheelContainer.classList.remove('spinning');
                    
                    // Det endelige resultat
                    const winningItem = activeMenu[Math.floor(Math.random() * activeMenu.length)];
                    numberEl.textContent = winningItem.id;
                    
                    // Delay before fading in the text  
                    setTimeout(() => {
                        categoryEl.textContent = getCategoryForID(winningItem.id);
                        nameEl.textContent = winningItem.name;
                        descEl.textContent = winningItem.desc;
                        
                        categoryEl.classList.add('visible');
                        nameEl.classList.add('visible'  );
                        descEl.classList.add('visible');
                        
                        btn.disabled = false;
                    }, 2000); // 2000ms delay before the text fades in
                }
            }, intervalTime);
        });
