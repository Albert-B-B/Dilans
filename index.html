<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍕 Dilan's Roulette - RHK Køkkenfest</title>
    <meta name="description" content="Det ultimative Dilan's Pizzaria roulette- og drikkespil til køkkenfester på Rigshospitalets Kollegium.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Top Navigation & Controls -->
    <header class="top-bar">
        <div class="brand-title">
            <span>🍕 DILAN'S ROULETTE</span>
            <span class="dorm-badge">RHK KØKKENFEST</span>
        </div>
        <div class="top-controls">
            <button id="tv-toggle" class="control-btn" title="Skift storskærmstilstand">📺 TV Mode</button>
            <button id="mute-toggle" class="control-btn" title="Slå lydeffekter til/fra">🔊 Lyd til</button>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="main-card">
        <!-- Player Setup & Diet Filters -->
        <section class="setup-row" aria-label="Spiller og filtre">
            <div class="player-input-wrap">
                <input 
                    type="text" 
                    id="player-name" 
                    class="player-input" 
                    placeholder="Hvem spinner? (f.eks. Jonas)" 
                    maxlength="30"
                    autocomplete="off"
                >
            </div>
            <div class="diet-filters">
                <label id="veg-badge" class="diet-badge">
                    <input type="checkbox" id="veg-toggle"> 🌱 Vegetar
                </label>
                <label id="pesce-badge" class="diet-badge">
                    <input type="checkbox" id="pesce-toggle"> 🐟 Pescetar
                </label>
            </div>
        </section>

        <!-- Slot Reel Viewport -->
        <div class="reel-wrapper" aria-label="Roulette hjul">
            <div class="reel-overlay-top"></div>
            <div class="reel-crosshair"></div>
            <div class="reel-viewport" id="reel-viewport">
                <div class="reel-strip" id="reel-strip">
                    <!-- Dynamic items rendered here -->
                </div>
            </div>
            <div class="reel-overlay-bottom"></div>
        </div>

        <!-- Outcome Details Panel -->
        <section class="outcome-panel" id="outcome-panel" aria-live="polite">
            <div class="outcome-header">
                <span class="outcome-category" id="outcome-category">VELKOMMEN</span>
            </div>
            <h2 class="outcome-title" id="outcome-title">Klar til at spinne!</h2>
            <p class="outcome-desc" id="outcome-desc">Tryk på knappen for at lade skæbnen vælge din aftensmad</p>
            <div class="beerbong-tally" id="beerbong-tally"></div>
        </section>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="spin-btn" class="spin-btn">🎰 Spin Hjulet</button>
            
            <div id="choice-actions" class="choice-actions">
                <button id="btn-accept" class="btn-accept">🍕 Accepter Ret</button>
                <button id="btn-beerbong" class="btn-beerbong">🍺 Tag Ølbong & Re-spin</button>
            </div>
        </div>
    </main>

    <!-- Dorm Kitchen Order Summary List -->
    <section class="order-card" aria-label="Dorm Bestillingsliste">
        <div class="order-header">
            <div class="order-title-wrap">
                <h3 class="order-title">📋 Køkkenets Bestilling</h3>
                <div class="order-stats">
                    <span id="stat-count" class="stat-pill">0 retter</span>
                    <span id="stat-beers" class="stat-pill beers">0 ølbong</span>
                </div>
            </div>
            <div class="order-actions">
                <button id="copy-orders-btn" class="btn-secondary">📋 Kopier Bestilling</button>
                <button id="clear-orders-btn" class="btn-secondary btn-danger">🗑️ Ryd</button>
            </div>
        </div>

        <ul id="order-list" class="order-list">
            <!-- Dynamic order items inserted here -->
        </ul>
    </section>

    <!-- App Logic Scripts (Supports direct file:// and http://) -->
    <script src="js/menuData.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/confetti.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
